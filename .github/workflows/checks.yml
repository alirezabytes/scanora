name: Source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        shell: pwsh
        run: |
          $flutterPath = Join-Path $env:RUNNER_TEMP flutter
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git $flutterPath
          Join-Path $flutterPath bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Run tests without native model downloads
        run: flutter test --no-pub test/reading_layout_and_color_test.dart test/document_processing_test.dart test/google_configuration_test.dart test/online_access_test.dart
